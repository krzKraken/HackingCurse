services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cyberlearn
      POSTGRES_PASSWORD: cyberlearn
      POSTGRES_DB: cyberlearn
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  postgres_data:
